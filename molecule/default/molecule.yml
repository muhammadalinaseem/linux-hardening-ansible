---
dependency:
  name: galaxy
  enabled: false
driver:
  name: docker
platforms:
  - name: "hardening-${MOLECULE_DISTRO:-debian12}"
    image: "geerlingguy/docker-${MOLECULE_DISTRO:-debian12}-ansible:latest"
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    command: ""
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: "${MOLECULE_PROJECT_DIRECTORY}/roles"
  inventory:
    group_vars:
      all:
        # Containers share the host kernel, so these parts are tested
        # for configuration only, not loaded.
        hardening_auditd_load_rules: false
        hardening_sysctl_enabled: false
        # Building the AIDE database is slow and not useful in CI.
        hardening_aide_init: false
        hardening_ssh_key_check_user: root
verifier:
  name: ansible
scenario:
  test_sequence:
    - destroy
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy
