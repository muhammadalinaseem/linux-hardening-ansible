---
# aide-common recommends a mail client, which pulls in a mail server
# (Postfix on Ubuntu, listening on port 25). Install without recommends.
- name: AIDE | Install packages without recommended extras (Debian/Ubuntu)
  ansible.builtin.apt:
    name: "{{ hardening_aide_packages }}"
    state: present
    install_recommends: false
  when: ansible_facts['os_family'] == 'Debian'

- name: AIDE | Install packages (RHEL family)
  ansible.builtin.package:
    name: "{{ hardening_aide_packages }}"
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: AIDE | Initialise the database (Debian/Ubuntu)
  ansible.builtin.command: aideinit --yes --force
  args:
    creates: /var/lib/aide/aide.db
  when:
    - hardening_aide_init | bool
    - ansible_facts['os_family'] == 'Debian'

- name: AIDE | Initialise the database (RHEL family)
  ansible.builtin.command: aide --init
  args:
    creates: /var/lib/aide/aide.db.new.gz
  when:
    - hardening_aide_init | bool
    - ansible_facts['os_family'] == 'RedHat'

- name: AIDE | Put the new database in place (RHEL family)
  ansible.builtin.copy:
    src: /var/lib/aide/aide.db.new.gz
    dest: /var/lib/aide/aide.db.gz
    remote_src: true
    force: false
    owner: root
    group: root
    mode: "0600"
  when:
    - hardening_aide_init | bool
    - ansible_facts['os_family'] == 'RedHat'
