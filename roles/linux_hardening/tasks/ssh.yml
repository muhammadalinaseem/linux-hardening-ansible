---
- name: SSH | Install OpenSSH server
  ansible.builtin.package:
    name: "{{ hardening_ssh_packages }}"
    state: present

- name: SSH | Find the home directory of the user Ansible logs in as
  ansible.builtin.getent:
    database: passwd
    key: "{{ hardening_ssh_key_check_user }}"
  when:
    - hardening_ssh_require_authorized_keys | bool
    - not (hardening_ssh_password_authentication | bool)

- name: SSH | Look for that user's authorized_keys
  ansible.builtin.stat:
    path: "{{ ansible_facts['getent_passwd'][hardening_ssh_key_check_user][4] }}/.ssh/authorized_keys"
  register: hardening_authorized_keys
  when:
    - hardening_ssh_require_authorized_keys | bool
    - not (hardening_ssh_password_authentication | bool)

- name: SSH | Refuse to disable passwords without a key in place
  ansible.builtin.assert:
    that:
      - hardening_authorized_keys.stat.exists
    fail_msg: >-
      {{ hardening_ssh_key_check_user }} has no ~/.ssh/authorized_keys. Disabling password
      login now could lock you out. Add a key first, or set
      hardening_ssh_require_authorized_keys: false if you know it is safe.
    quiet: true
  when:
    - hardening_ssh_require_authorized_keys | bool
    - not (hardening_ssh_password_authentication | bool)

- name: SSH | Make sure host keys exist
  ansible.builtin.command: ssh-keygen -A
  register: hardening_ssh_keygen
  changed_when: hardening_ssh_keygen.stdout | length > 0

- name: SSH | Make sure the privilege separation directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    owner: root
    group: root
    mode: "0755"
  when: ansible_facts['os_family'] == 'Debian'

- name: SSH | Make sure sshd reads drop-in files
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^Include\s+/etc/ssh/sshd_config\.d/'
    line: Include /etc/ssh/sshd_config.d/*.conf
    insertbefore: BOF
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart sshd

- name: SSH | Create the drop-in directory
  ansible.builtin.file:
    path: /etc/ssh/sshd_config.d
    state: directory
    owner: root
    group: root
    mode: "0755"

# sshd uses the FIRST value it finds for most settings, and drop-ins are read
# in name order, so "00-" makes sure these settings win over vendor defaults.
- name: SSH | Deploy hardened settings
  ansible.builtin.template:
    src: sshd_hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    owner: root
    group: root
    mode: "0600"
  notify: Restart sshd

- name: SSH | Validate the full configuration before any restart
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false
