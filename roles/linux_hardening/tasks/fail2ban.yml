---
- name: Fail2ban | Enable EPEL on RHEL-family systems
  ansible.builtin.package:
    name: epel-release
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Fail2ban | Install packages
  ansible.builtin.package:
    name: "{{ hardening_fail2ban_packages }}"
    state: present

- name: Fail2ban | Deploy the base jail
  ansible.builtin.template:
    src: jail_hardening.local.j2
    dest: /etc/fail2ban/jail.d/00-hardening.local
    owner: root
    group: root
    mode: "0644"
  notify: Restart fail2ban

- name: Fail2ban | Enable and start the service
  ansible.builtin.service:
    name: fail2ban
    enabled: true
    state: started
