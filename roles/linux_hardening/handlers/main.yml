---
- name: Restart sshd
  ansible.builtin.service:
    name: "{{ hardening_ssh_service }}"
    state: restarted

- name: Restart fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: restarted

- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true
  when: hardening_auditd_load_rules | bool

- name: Apply sysctl
  ansible.builtin.command: sysctl --system
  changed_when: true
